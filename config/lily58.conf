CONFIG_ZMK_KEYBOARD_NAME="Lily58Wireless"
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_SLEEP=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Trackpad (Azoteq TPS43, right half) support. The driver itself
# (CONFIG_INPUT_TPS43 / CONFIG_I2C) is only needed on the half the
# trackpad is physically wired to - see lily58_right.conf.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# The trackpad's input-processing thread needs more stack than the
# default; both halves get this since input-split events flow through
# the central side too.
CONFIG_INPUT_THREAD_STACK_SIZE=2048